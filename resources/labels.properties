# QTAU Connector Workspace — UI Labels
#
# All user-visible strings are defined here so they can be changed in one place
# without touching source code.  Keys use lowercase_underscore naming.
# Multi-value fields (e.g. table column names) use comma-separated values.
# Lines starting with '#' or '!' are treated as comments.

