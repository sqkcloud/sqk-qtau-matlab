# QTAU Connector Workspace — Application Configuration
#
# Edit this file to change runtime settings without modifying source code.
# Lines starting with '#' or '!' are treated as comments.
# Format: key=value  (leading/trailing whitespace around key and value is trimmed)
#
# base_url     : FastAPI backend base URL — no trailing slash.
#                Leave EMPTY in the shipped toolbox so end-users must
#                set their own QTAU server URL on first launch via
#                Settings → Connection (or the URL field on the Login
#                dialog). AppState falls back to http://localhost:5715
#                when this key is blank, which is a sensible default
#                for self-hosted setups but always-fails for users who
#                need to connect to a remote QTAU server — that
#                mismatch is the cue to open Settings.
#                For local development, override locally without
#                committing the change.
# login_path   : POST path for username/password login (must start with /)
# http_timeout : HTTP request timeout in seconds (integer)
# app_name     : Application display name (not yet used by app code)
# app_version  : Application version label (not yet used by app code)

base_url=
login_path=/api/auth/login
http_timeout=30
app_name=QTAU Connector Workspace
app_version=1.0.0
docs_url=https://docs.quantum.ibm.com
screen_cache_ttl=30
# Per-screen overrides for the cache TTL. Resolved by
# NavigationManager.ttlForScreen with property key shape
# screen_cache_ttl_<lowercased_key> (spaces → underscores). The four
# lookup-driven planning screens (Backends, Mitigation Compare,
# Resource Estimator, Run Planner) hold their fetched data for 5
# minutes because their inputs (backend roster, mitigation level
# catalog, circuit library) change rarely inside a session — a quick
# nav-away-and-back used to re-fire ~750 ms of cross-continent
# round-trips per visit at the 30 s default.
screen_cache_ttl_backends=300
screen_cache_ttl_mitigation_compare=300
screen_cache_ttl_resource_estimator=300
screen_cache_ttl_run_planner=300
# Logger threshold. DEBUG/HTTP map to priority 0, INFO=1, WARN=2,
# ERROR=3. Default INFO suppresses the per-HTTP-request Logger.http
# line (which previously fprintf'd ~80 lines per Backends visit
# during the calibration-history fan-out). Set to DEBUG during
# development if you need to see every outbound request.
log_level=INFO
# Shared lookup cache TTL (seconds). Controls how long /api/circuits,
# /api/backends, and /api/mitigation/levels responses are reused across
# Mitigation Compare / Run Planner / Resource Estimator VMs before a
# fresh fetch is issued. Longer than screen_cache_ttl because these
# lookups change rarely inside a session.
shared_cache_ttl=120

# QEC Simulation defaults
qec_default_error_prob=0.05
qec_default_rounds=1
qec_default_trials=1000
qec_sweep_points=50
# Compare All Codes sweeps the listed codes at the listed point density.
# After the Phase A+B+C refactor the Compare button uses analytical
# closed-form fidelity curves (compareCodesAnalytical), so even Shor(9)
# / Steane(7) finish in ~1 ms total instead of ~16 minutes of MC.
#
# qec_compare_codes — comma-separated code IDs to include in Compare.
#   Operators can drop the heavy codes (shor9 / steane7) by removing
#   them here without UI changes. Default keeps all five since the
#   analytical path is instant.
# qec_compare_trials — reserved for a future "MC-mode" toggle; if a
#   future flag re-routes Compare through the MC engine, this lower
#   trial count keeps the run under a minute.
qec_compare_points=20
qec_compare_codes=bitflip3,phaseflip3,shor9,steane7,perfect5
qec_compare_trials=20
qec_max_local_qubits=9

# Detailed Analysis defaults
confidence_threshold=0.94

# QEC Visualization defaults
qec_viz_default_distance=3
qec_viz_default_error_prob=0.05
qec_viz_decay_steps=30
qec_viz_decay_max_prob=0.5
qec_viz_max_rounds=10
